<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg6)"/>
  <!-- Decorative tatami pattern -->
  <rect x="0" y="350" width="600" height="50" fill="#4CAF50" opacity="0.1"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#4CAF50" stroke-width="1" opacity="0.3"/>
  <!-- Shield icon -->
  <g transform="translate(250, 60)">
    <path d="M50 10 L90 30 L90 70 Q90 110 50 130 Q10 110 10 70 L10 30 Z" fill="#4CAF50" opacity="0.15" stroke="#4CAF50" stroke-width="2"/>
    <text x="50" y="82" font-family="sans-serif" font-size="36" fill="#2E7D32" text-anchor="middle" font-weight="700">&#x2717;</text>
  </g>
  <!-- Bug icon (simple) -->
  <g transform="translate(265, 95)">
    <ellipse cx="35" cy="20" rx="12" ry="8" fill="none" stroke="#2E7D32" stroke-width="1.5" opacity="0.5"/>
    <line x1="25" y1="14" x2="20" y2="8" stroke="#2E7D32" stroke-width="1" opacity="0.5"/>
    <line x1="45" y1="14" x2="50" y2="8" stroke="#2E7D32" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Tag badge -->
  <rect x="240" y="200" width="120" height="30" rx="15" fill="#4CAF50"/>
  <text x="300" y="220" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">衛生</text>
  <!-- Title -->
  <text x="300" y="275" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="28" font-weight="700" fill="#2E7D32" text-anchor="middle" letter-spacing="2">
    畳のダニ対策
  </text>
  <text x="300" y="310" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="22" font-weight="700" fill="#2E7D32" text-anchor="middle" letter-spacing="1">
    完全ガイド
  </text>
  <!-- Subtitle -->
  <text x="300" y="345" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#558B2F" text-anchor="middle">
    原因と予防法を徹底解説
  </text>
  <!-- Brand line -->
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
</svg>