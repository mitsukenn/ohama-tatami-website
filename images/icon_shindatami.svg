  <line x1="14" y1="66" x2="102" y2="66" stroke="#4E8F40" stroke-width="1.5" opacity="0.5"/>
  <line x1="14" y1="80" x2="102" y2="80" stroke="#4E8F40" stroke-width="1.5" opacity="0.5"/>
  <line x1="35" y1="38" x2="35" y2="92" stroke="#4E8F40" stroke-width="1" opacity="0.3"/>
  <line x1="56" y1="38" x2="56" y2="92" stroke="#4E8F40" stroke-width="1" opacity="0.3"/>
  <line x1="77" y1="38" x2="77" y2="92" stroke="#4E8F40" stroke-width="1" opacity="0.3"/>
