<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E1"/>
      <stop offset="100%" style="stop-color:#FFECB3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg9)"/>
  <rect x="0" y="350" width="600" height="50" fill="#F57F17" opacity="0.06"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#F57F17" stroke-width="1" opacity="0.15"/>
  <!-- Three material swatches -->
  <g transform="translate(155, 55)">
    <!-- Washi -->
    <rect x="0" y="0" width="80" height="55" rx="6" fill="#C9A84C" opacity="0.2" stroke="#C9A84C" stroke-width="1.5"/>
    <text x="40" y="35" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#8D6E0F" text-anchor="middle" font-weight="700">和紙</text>
    <!-- Jushi -->
    <rect x="100" y="0" width="80" height="55" rx="6" fill="#8D6E63" opacity="0.2" stroke="#8D6E63" stroke-width="1.5"/>
    <text x="140" y="35" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#5D4037" text-anchor="middle" font-weight="700">樹脂</text>
    <!-- Igusa -->
    <rect x="200" y="0" width="80" height="55" rx="6" fill="#556B2F" opacity="0.2" stroke="#556B2F" stroke-width="1.5"/>
    <text x="240" y="35" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#33691E" text-anchor="middle" font-weight="700">い草</text>
  </g>
  <!-- Comparison arrows -->
  <g transform="translate(245, 120)">
    <text x="0" y="15" font-family="sans-serif" font-size="18" fill="#C9A84C" opacity="0.5">&#x2194;</text>
    <text x="60" y="15" font-family="sans-serif" font-size="18" fill="#C9A84C" opacity="0.5">&#x2194;</text>
  </g>
  <!-- Tag badge -->
  <rect x="250" y="195" width="100" height="30" rx="15" fill="#C9A84C"/>
  <text x="300" y="215" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">素材</text>
  <!-- Title -->
  <text x="300" y="262" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="22" font-weight="700" fill="#8D6E0F" text-anchor="middle" letter-spacing="1">
    和紙畳・樹脂畳・い草畳の
  </text>
  <text x="300" y="295" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="24" font-weight="700" fill="#8D6E0F" text-anchor="middle" letter-spacing="2">
    違いを徹底比較
  </text>
  <!-- Subtitle -->
  <text x="300" y="335" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#A1887F" text-anchor="middle">
    素材ごとの特徴を解説
  </text>
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
</svg>