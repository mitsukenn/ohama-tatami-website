<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2F1"/>
      <stop offset="100%" style="stop-color:#B2DFDB"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg14)"/>
  <rect x="0" y="350" width="600" height="50" fill="#00695C" opacity="0.06"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#00695C" stroke-width="1" opacity="0.15"/>
  <!-- Building/apartment icon -->
  <g transform="translate(250, 40)">
    <rect x="10" y="15" width="80" height="80" rx="4" fill="none" stroke="#00695C" stroke-width="2" opacity="0.25"/>
    <!-- Windows -->
    <rect x="22" y="28" width="14" height="14" rx="2" fill="#00695C" opacity="0.12"/>
    <rect x="42" y="28" width="14" height="14" rx="2" fill="#00695C" opacity="0.12"/>
    <rect x="62" y="28" width="14" height="14" rx="2" fill="#00695C" opacity="0.12"/>
    <rect x="22" y="50" width="14" height="14" rx="2" fill="#00695C" opacity="0.12"/>
    <rect x="42" y="50" width="14" height="14" rx="2" fill="#00695C" opacity="0.12"/>
    <rect x="62" y="50" width="14" height="14" rx="2" fill="#00695C" opacity="0.12"/>
    <!-- Door -->
    <rect x="40" y="72" width="20" height="23" rx="2" fill="#00695C" opacity="0.18"/>
    <!-- Yen sign -->
    <circle cx="92" cy="25" r="16" fill="#00695C" opacity="0.1" stroke="#00695C" stroke-width="1.5"/>
    <text x="92" y="31" font-family="sans-serif" font-size="16" fill="#00695C" text-anchor="middle" font-weight="700" opacity="0.4">&#165;</text>
  </g>
  <!-- Tag badge -->
  <rect x="250" y="200" width="100" height="30" rx="15" fill="#00695C"/>
  <text x="300" y="220" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">費用</text>
  <!-- Title -->
  <text x="300" y="265" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="22" font-weight="700" fill="#004D40" text-anchor="middle" letter-spacing="1">
    賃貸マンションの畳交換は
  </text>
  <text x="300" y="300" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="24" font-weight="700" fill="#004D40" text-anchor="middle" letter-spacing="1">
    誰が負担する？
  </text>
  <!-- Subtitle -->
  <text x="300" y="340" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#00695C" text-anchor="middle">
    費用負担のルールを解説
  </text>
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
</svg>