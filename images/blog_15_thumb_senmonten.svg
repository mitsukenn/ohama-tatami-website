<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EDE7F6"/>
      <stop offset="100%" style="stop-color:#D1C4E9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg15)"/>
  <rect x="0" y="350" width="600" height="50" fill="#5E35B1" opacity="0.06"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#5E35B1" stroke-width="1" opacity="0.15"/>
  <!-- Two shop icons -->
  <g transform="translate(150, 45)">
    <!-- Home center (big box) -->
    <rect x="0" y="20" width="100" height="60" rx="4" fill="#5E35B1" opacity="0.1" stroke="#5E35B1" stroke-width="1.5"/>
    <rect x="0" y="12" width="100" height="12" rx="3" fill="#5E35B1" opacity="0.15"/>
    <text x="50" y="60" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#5E35B1" text-anchor="middle" opacity="0.5">ホームセンター</text>
    <!-- VS -->
    <text x="150" y="55" font-family="'Noto Sans JP', sans-serif" font-size="20" fill="#5E35B1" text-anchor="middle" font-weight="700" opacity="0.35">VS</text>
    <!-- Specialty shop (small shop) -->
    <path d="M200 20 L250 20 L260 12 L190 12 Z" fill="#556B2F" opacity="0.2"/>
    <rect x="200" y="20" width="60" height="60" rx="4" fill="#556B2F" opacity="0.1" stroke="#556B2F" stroke-width="1.5"/>
    <rect x="215" y="45" width="20" height="35" rx="2" fill="#556B2F" opacity="0.15"/>
    <text x="230" y="95" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#556B2F" text-anchor="middle" opacity="0.6">畳専門店</text>
  </g>
  <!-- Tag badge -->
  <rect x="250" y="200" width="100" height="30" rx="15" fill="#5E35B1"/>
  <text x="300" y="220" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">比較</text>
  <!-- Title -->
  <text x="300" y="268" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="24" font-weight="700" fill="#311B92" text-anchor="middle" letter-spacing="1">
    ホームセンターと
  </text>
  <text x="300" y="303" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="24" font-weight="700" fill="#311B92" text-anchor="middle" letter-spacing="1">
    畳専門店の違い
  </text>
  <!-- Subtitle -->
  <text x="300" y="342" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#5E35B1" text-anchor="middle">
    どこに頼むべきか比較
  </text>
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
</svg>