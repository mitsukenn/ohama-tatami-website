<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="tatami2" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#7AB868"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#5E9A4E" stroke-width="1" opacity="0.5"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#5E9A4E" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#FAF8F5"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="240" rx="100" ry="18" fill="#00000015"/>
  <!-- Mini tatami mat -->
  <rect x="90" y="90" width="220" height="140" rx="10" fill="url(#tatami2)" stroke="#556B2F" stroke-width="3"/>
  <!-- Border bands -->
  <rect x="90" y="90" width="220" height="16" rx="5" fill="#C9A84C" opacity="0.85"/>
  <rect x="90" y="214" width="220" height="16" rx="5" fill="#C9A84C" opacity="0.85"/>
  <!-- Decorative figure on mat -->
  <ellipse cx="200" cy="160" rx="18" ry="18" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="200" y="166" text-anchor="middle" font-size="22" fill="rgba(255,255,255,0.8)">🎎</text>
  <!-- Label -->
  <rect x="100" y="252" width="200" height="36" rx="6" fill="#556B2F" opacity="0.9"/>
  <text x="200" y="274" text-anchor="middle" font-family="'Hiragino Sans', 'MS Gothic', sans-serif" font-size="14" fill="white" font-weight="bold">ミニ畳（小畳）</text>
</svg>
