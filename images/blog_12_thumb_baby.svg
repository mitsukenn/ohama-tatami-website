<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg12)"/>
  <rect x="0" y="350" width="600" height="50" fill="#EF6C00" opacity="0.06"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#EF6C00" stroke-width="1" opacity="0.15"/>
  <!-- Baby/heart icon -->
  <g transform="translate(255, 45)">
    <!-- Heart -->
    <path d="M45 30 Q45 10 30 10 Q15 10 15 30 Q15 50 45 70 Q75 50 75 30 Q75 10 60 10 Q45 10 45 30 Z" fill="#EF6C00" opacity="0.12" stroke="#EF6C00" stroke-width="1.5"/>
    <!-- Small hand print -->
    <circle cx="38" cy="42" r="5" fill="#EF6C00" opacity="0.15"/>
    <circle cx="30" cy="34" r="3" fill="#EF6C00" opacity="0.15"/>
    <circle cx="38" cy="30" r="3" fill="#EF6C00" opacity="0.15"/>
    <circle cx="46" cy="32" r="3" fill="#EF6C00" opacity="0.15"/>
    <circle cx="52" cy="38" r="3" fill="#EF6C00" opacity="0.15"/>
  </g>
  <!-- Tatami mat -->
  <g transform="translate(240, 120)">
    <rect x="0" y="0" width="120" height="25" rx="4" fill="none" stroke="#EF6C00" stroke-width="1.5" opacity="0.2"/>
    <line x1="0" y1="8" x2="120" y2="8" stroke="#EF6C00" stroke-width="0.5" opacity="0.15"/>
    <line x1="0" y1="17" x2="120" y2="17" stroke="#EF6C00" stroke-width="0.5" opacity="0.15"/>
    <text x="60" y="-5" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#EF6C00" text-anchor="middle" opacity="0.4">やわらかい</text>
  </g>
  <!-- Tag badge -->
  <rect x="240" y="200" width="120" height="30" rx="15" fill="#EF6C00"/>
  <text x="300" y="220" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">暮らし</text>
  <!-- Title -->
  <text x="300" y="265" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="22" font-weight="700" fill="#BF360C" text-anchor="middle" letter-spacing="1">
    赤ちゃんがいる家庭に
  </text>
  <text x="300" y="298" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="24" font-weight="700" fill="#BF360C" text-anchor="middle" letter-spacing="1">
    畳がおすすめな理由
  </text>
  <!-- Subtitle -->
  <text x="300" y="338" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#EF6C00" text-anchor="middle">
    安全・快適な和室づくり
  </text>
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
</svg>