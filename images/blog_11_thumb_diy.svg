<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F3E5F5"/>
      <stop offset="100%" style="stop-color:#E1BEE7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg11)"/>
  <rect x="0" y="350" width="600" height="50" fill="#7B1FA2" opacity="0.06"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#7B1FA2" stroke-width="1" opacity="0.15"/>
  <!-- Tools icon -->
  <g transform="translate(255, 50)">
    <!-- Wrench -->
    <path d="M20 10 L20 55 Q20 65 30 65 Q40 65 40 55 L40 10 Q40 0 30 0 Q20 0 20 10 Z" fill="none" stroke="#7B1FA2" stroke-width="2" opacity="0.3"/>
    <rect x="22" y="50" width="16" height="15" rx="2" fill="#7B1FA2" opacity="0.15"/>
    <!-- Hammer -->
    <line x1="60" y1="15" x2="60" y2="70" stroke="#7B1FA2" stroke-width="2.5" opacity="0.3"/>
    <rect x="48" y="5" width="24" height="14" rx="3" fill="#7B1FA2" opacity="0.15" stroke="#7B1FA2" stroke-width="1.5"/>
  </g>
  <!-- VS element -->
  <g transform="translate(270, 125)">
    <text x="30" y="18" font-family="'Noto Sans JP', sans-serif" font-size="14" fill="#7B1FA2" text-anchor="middle" font-weight="700" opacity="0.4">DIY vs プロ</text>
  </g>
  <!-- Tag badge -->
  <rect x="250" y="200" width="100" height="30" rx="15" fill="#7B1FA2"/>
  <text x="300" y="220" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">比較</text>
  <!-- Title -->
  <text x="300" y="270" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="26" font-weight="700" fill="#4A148C" text-anchor="middle" letter-spacing="1">
    畳の張替えは
  </text>
  <text x="300" y="305" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="26" font-weight="700" fill="#4A148C" text-anchor="middle" letter-spacing="1">
    DIYできる？
  </text>
  <!-- Subtitle -->
  <text x="300" y="342" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#7B1FA2" text-anchor="middle">
    メリット・デメリットを比較
  </text>
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
</svg>