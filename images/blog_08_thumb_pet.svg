<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg8)"/>
  <rect x="0" y="350" width="600" height="50" fill="#E65100" opacity="0.06"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#E65100" stroke-width="1" opacity="0.15"/>
  <!-- Paw print icon -->
  <g transform="translate(260, 55)">
    <circle cx="40" cy="50" rx="18" ry="22" fill="#E65100" opacity="0.15"/>
    <circle cx="20" cy="25" r="9" fill="#E65100" opacity="0.15"/>
    <circle cx="42" cy="15" r="9" fill="#E65100" opacity="0.15"/>
    <circle cx="62" cy="25" r="9" fill="#E65100" opacity="0.15"/>
  </g>
  <!-- Tatami mat under paw -->
  <g transform="translate(250, 120)">
    <rect x="0" y="0" width="100" height="20" rx="3" fill="none" stroke="#E65100" stroke-width="1.5" opacity="0.25"/>
    <line x1="0" y1="7" x2="100" y2="7" stroke="#E65100" stroke-width="0.5" opacity="0.15"/>
    <line x1="0" y1="14" x2="100" y2="14" stroke="#E65100" stroke-width="0.5" opacity="0.15"/>
  </g>
  <!-- Tag badge -->
  <rect x="240" y="200" width="120" height="30" rx="15" fill="#E65100"/>
  <text x="300" y="220" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">暮らし</text>
  <!-- Title -->
  <text x="300" y="268" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="26" font-weight="700" fill="#BF360C" text-anchor="middle" letter-spacing="1">
    ペットと暮らす
  </text>
  <text x="300" y="303" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="26" font-weight="700" fill="#BF360C" text-anchor="middle" letter-spacing="1">
    畳の選び方
  </text>
  <!-- Subtitle -->
  <text x="300" y="340" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#E65100" text-anchor="middle">
    傷・汚れに強い畳とは
  </text>
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
