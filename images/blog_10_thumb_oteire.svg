<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#B3E5FC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg10)"/>
  <rect x="0" y="350" width="600" height="50" fill="#0277BD" opacity="0.06"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#0277BD" stroke-width="1" opacity="0.15"/>
  <!-- Broom/cleaning icon -->
  <g transform="translate(265, 50)">
    <!-- Broom handle -->
    <line x1="35" y1="10" x2="35" y2="70" stroke="#0277BD" stroke-width="3" opacity="0.3"/>
    <!-- Broom head -->
    <path d="M15 70 Q15 90 35 95 Q55 90 55 70 Z" fill="#0277BD" opacity="0.15" stroke="#0277BD" stroke-width="1.5"/>
    <!-- Sparkle -->
    <text x="65" y="30" font-family="sans-serif" font-size="20" fill="#0277BD" opacity="0.3">&#x2728;</text>
  </g>
  <!-- Clock/timer element -->
  <g transform="translate(275, 115)">
    <circle cx="25" cy="15" r="14" fill="none" stroke="#0277BD" stroke-width="1.5" opacity="0.3"/>
    <line x1="25" y1="15" x2="25" y2="6" stroke="#0277BD" stroke-width="1.5" opacity="0.3"/>
    <line x1="25" y1="15" x2="32" y2="15" stroke="#0277BD" stroke-width="1.5" opacity="0.3"/>
  </g>
  <!-- Tag badge -->
  <rect x="235" y="200" width="130" height="30" rx="15" fill="#0277BD"/>
  <text x="300" y="220" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">お手入れ</text>
  <!-- Title -->
  <text x="300" y="268" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="24" font-weight="700" fill="#01579B" text-anchor="middle" letter-spacing="1">
    畳の寿命は何年？
  </text>
  <text x="300" y="303" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="24" font-weight="700" fill="#01579B" text-anchor="middle" letter-spacing="1">
    長持ちさせるお手入れ術
  </text>
  <!-- Subtitle -->
  <text x="300" y="340" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#0277BD" text-anchor="middle">
    プロが教えるメンテナンス
  </text>
  <rect x="0" y="390" width="600" height="10" fill="#556B2F" opacity="0.15"/>
</svg>